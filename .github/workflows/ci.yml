name: Library checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: streams
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: streams
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U streams -d streams"
          --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://streams@127.0.0.1:5432/streams
      PGPASSWORD: local-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:conformance:hot
      - run: pnpm test:package
