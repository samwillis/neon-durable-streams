name: Library checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: library-checks-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package

  neon:
    name: Neon qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require real Neon credentials
        run: |
          test -n "$NEON_API_KEY" && test -n "$NEON_PROJECT_ID" && test -n "$NEON_PARENT_BRANCH_ID" || {
            echo 'Neon qualification requires project-scoped credentials. Fork PRs must be reviewed and tested on a trusted maintainer branch.'
            exit 1
          }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated Neon Postgres, Realtime, and Object Storage
        run: pnpm neon:test:create
      - run: pnpm build
      - name: Deploy the consumer Function and its recovery trigger on this branch
        run: pnpm neon:test:deploy
      - name: Actual Function ingress, HTTPS webhooks, SSE, sealed replay, and cron recovery
        run: pnpm test:function
      - name: Real Neon Realtime and Object Storage integration
        run: pnpm test:neon --reporter=default --reporter=json --outputFile=neon-results.json
      - name: Preserve packed mixed-version Function evidence
        if: ${{ always() && hashFiles('qualification-results/rolling-upgrade.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rolling-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-results/rolling-upgrade.json
      - name: Summarize real-service test results immediately
        if: ${{ always() && hashFiles('neon-results.json') != '' }}
        run: node scripts/summarize-test-results.mjs neon-results.json neon-test-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('neon-test-summary.json') != '' }}
        with:
          name: neon-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: neon-test-summary.json
      - name: Postgres integration and process-loss tests on Neon
        if: ${{ !cancelled() && env.NEON_TEST_BRANCH_ID != '' }}
        run: pnpm test:integration --reporter=default --reporter=json --outputFile=integration-results.json
      - name: Summarize transaction test results immediately
        if: ${{ always() && hashFiles('integration-results.json') != '' }}
        run: node scripts/summarize-test-results.mjs integration-results.json integration-test-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('integration-test-summary.json') != '' }}
        with:
          name: transaction-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-test-summary.json
      - name: Point-in-time branch adoption and stopped-Function in-place restore
        if: ${{ !cancelled() && env.NEON_TEST_BRANCH_ID != '' }}
        run: pnpm test:recovery --reporter=default --reporter=json --outputFile=recovery-results.json
      - name: Summarize recovery failures immediately
        if: ${{ always() && hashFiles('recovery-results.json') != '' }}
        run: node scripts/summarize-test-results.mjs recovery-results.json recovery-test-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('recovery-test-summary.json') != '' }}
        with:
          name: recovery-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-test-summary.json
      - name: Preserve in-place restore evidence
        if: ${{ always() && hashFiles('qualification-results/inplace-restore.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: inplace-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-results/inplace-restore.json
      - name: Preserve Function rollout readiness probes
        if: ${{ always() && hashFiles('qualification-results/function-readiness-*.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-readiness-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-results/function-readiness-*.json
      - name: Full upstream conformance colocated on Neon (subscriptions enabled)
        if: ${{ !cancelled() && env.NEON_TEST_BRANCH_ID != '' }}
        run: pnpm test:conformance:neon
      - name: Preserve colocated suite provenance and runtime
        if: ${{ always() && hashFiles('qualification-results/colocated-conformance.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: conformance-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-results/colocated-conformance.json
      - name: Preserve complete conformance results
        if: ${{ always() && hashFiles('conformance-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: conformance-results.json
      - name: Delete any interrupted recovery drill branch
        if: ${{ always() && hashFiles('.neon-test-state-recovery.json') != '' }}
        env:
          NEON_TEST_STATE_FILE: .neon-test-state-recovery.json
        run: pnpm neon:test:delete
      - name: Delete interrupted in-place restore branches
        if: ${{ always() && hashFiles('.neon-test-state-inplace.json') != '' }}
        run: node scripts/neon-test-inplace-cleanup.mjs
      - name: Delete interrupted rolling Functions and installed consumers
        if: ${{ always() && (hashFiles('.neon-test-state-rolling.json') != '' || hashFiles('.neon-test-state-rolling-artifacts.json') != '') }}
        run: node scripts/neon-test-rolling-cleanup.mjs
      - name: Delete this run's Neon branch
        if: ${{ always() && hashFiles('.neon-test-state.json') != '' }}
        run: pnpm neon:test:delete

  hints:
    name: Neon append-hint delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ vars.NEON_PARENT_BRANCH_ID }}
      NEON_TEST_BRANCH_LABEL: hints
      NEON_TEST_MAINTENANCE_HINTS: 'on'
      NEON_TEST_NO_CRON: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Require real Neon credentials
        run: test -n "$NEON_API_KEY" && test -n "$NEON_PROJECT_ID" && test -n "$NEON_PARENT_BRANCH_ID"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Provision a separate isolated Neon branch
        run: pnpm neon:test:create
      - name: Deploy with append hints and no scheduled worker
        run: pnpm neon:test:deploy
      - name: Prove hinted Realtime wakes and full-chunk sealing
        run: pnpm test:hints
      - name: Preserve Function rollout readiness probes
        if: ${{ always() && hashFiles('qualification-results/function-readiness-*.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-readiness-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-results/function-readiness-*.json
      - name: Delete the hint test branch
        if: ${{ always() && hashFiles('.neon-test-state.json') != '' }}
        run: pnpm neon:test:delete
