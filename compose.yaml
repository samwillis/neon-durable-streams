services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: streams
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: streams
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streams -d streams"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
